name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test internal packages with coverage
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Test command package
        run: go test -race ./cmd/...

      - name: Build
        run: make build

      - name: Verify binary runs
        run: ./bin/ynab --version
